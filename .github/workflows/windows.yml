name: Windows build

# 产出可直接运行、无第三方 DLL 依赖的 Windows 可执行文件（100% 静态链接）。
# 触发：推送到 main、Pull Request、或在 Actions 页面手动 Run workflow。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 (MinGW-w64 MINGW64/msvcrt, static)
    runs-on: windows-latest
    # 防止某个步骤卡死时一直占用 runner
    timeout-minutes: 15
    defaults:
      run:
        # 构建用 MSYS2 的 bash，便于使用 * 通配符
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          # MINGW64 环境链接 Windows 自带的 msvcrt.dll，兼容面最广
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Build (fully static)
        run: |
          set -eux
          mkdir -p dist

          gcc -std=c11 -O2 -Iinclude -c modules/quick_log/quick_log.c -o quick_log.o
          ar rcs dist/libquick_log.a quick_log.o

          gcc -std=c11 -O2 -Iinclude -static -static-libgcc \
              modules/formatter/*.c -o dist/formatter.exe

          gcc -std=c11 -O2 -Iinclude -static -static-libgcc \
              modules/hello_world/main.c dist/libquick_log.a -o dist/hello_world.exe

          objdump -p dist/formatter.exe | grep 'DLL Name' | tee dist/dll-deps.txt
          if grep -qiE 'libgcc|libstdc|libwinpthread|libssp' dist/dll-deps.txt; then
            echo "::error::存在非系统 DLL 依赖，无法独立运行"
            exit 1
          fi
          ls -l dist

      # 先上传产物：即使后面的烟测失败，也不影响把 exe 传上去
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatter-windows-x64
          path: |
            dist/formatter.exe
            dist/hello_world.exe
            dist/libquick_log.a
          if-no-files-found: error

      # 用 PowerShell 逐个跑，并给每次调用加超时、打印退出码：
      # 卡死或崩溃都能在一次运行里看出来。
      - name: Smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          [IO.File]::WriteAllText("$PWD/smoke.c", "int main(void)`n{`n    int a = 1 + 2;`n    return a;`n}`n")

          function Invoke-Tool {
            param([string]$Exe, [string[]]$Arguments, [string]$OutFile, [int]$TimeoutMs = 60000)
            $tmp = Join-Path $env:TEMP ("out-" + [IO.Path]::GetRandomFileName())
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $Exe -ArgumentList $Arguments -NoNewWindow -PassThru -RedirectStandardOutput $tmp
            if (-not $p.WaitForExit($TimeoutMs)) {
              $p.Kill()
              throw "TIMEOUT after ${TimeoutMs}ms: $Exe $($Arguments -join ' ')"
            }
            $sw.Stop()
            $size = if (Test-Path $tmp) { (Get-Item $tmp).Length } else { 0 }
            Write-Host ("exit=0x{0:X8} ({1}ms, {2} bytes out): {3} {4}" -f $p.ExitCode, $sw.ElapsedMilliseconds, $size, $Exe, ($Arguments -join ' '))
            if (Test-Path $tmp) { Move-Item -Force $tmp $OutFile }
            else { Set-Content -Path $OutFile -Value '' }
          }

          Invoke-Tool dist/formatter.exe @('--help') help.txt
          Invoke-Tool dist/formatter.exe @('smoke.c', '--format', 'dist/smoke.formatted.c') smoke.log
          Invoke-Tool dist/formatter.exe @('demo.c', '--format', 'dist/demo.formatted.c') format.log
          Invoke-Tool dist/formatter.exe @('input_test.c') diag.log
          Invoke-Tool dist/hello_world.exe @() hello.txt

          Select-String -Path help.txt   -Pattern 'formatter \[options\]' -Quiet | Out-Null

          if ((Get-Item dist/smoke.formatted.c).Length -le 0) { throw 'smoke.c 格式化输出为空' }
          if ((Get-Item dist/demo.formatted.c).Length  -le 0) { throw 'demo.c 格式化输出为空' }
          if (-not (Select-String -Path format.log -Pattern 'AST Structure:' -Quiet)) { throw '缺少 AST 输出' }
          if (-not (Select-String -Path diag.log   -Pattern 'Expected variable name' -Quiet)) { throw '缺少错误诊断' }
          if (-not (Select-String -Path hello.txt  -Pattern 'Hello World' -Quiet)) { throw 'hello_world 异常' }

          Write-Host "smoke lines: $((Get-Content dist/smoke.formatted.c).Count)"
          Write-Host "demo  lines: $((Get-Content dist/demo.formatted.c).Count)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: formatter-windows-x64
          path: |
            dist/formatter.exe
            dist/hello_world.exe
            dist/libquick_log.a
          if-no-files-found: error
